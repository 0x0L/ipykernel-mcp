[mcp_servers.jupyter-python]
command = "uv"
args = [
    "run",
    "--project", "/absolute/path/to/jupyter-kernel-mcp",
    "--locked",
    "--dev",
    "jupyter-kernel-mcp",
    "--jupyter", "/absolute/path/to/jupyter-kernel-mcp/.venv/bin/jupyter",
    "--kernel", "python3",
    "--cwd", "/absolute/path/to/project",
]
startup_timeout_sec = 60
tool_timeout_sec = 90
